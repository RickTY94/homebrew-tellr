name: Auto-update tellr formula

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new commits and update formula
        run: |
          # Get latest commit SHA from ai-slide-generator main
          LATEST_SHA=$(curl -s https://api.github.com/repos/robertwhiffin/ai-slide-generator/commits/main | jq -r '.sha[:7]')
          
          # Get current version from formula
          CURRENT_VERSION=$(grep 'version "' Formula/tellr.rb | head -1 | sed 's/.*version "//;s/".*//')
          
          # Check if SHA already in current version
          if echo "$CURRENT_VERSION" | grep -q "$LATEST_SHA"; then
            echo "Already up to date (${CURRENT_VERSION})"
            exit 0
          fi
          
          # New commit found - generate new version
          NEW_VERSION="$(date -u +'%Y.%m.%d').${LATEST_SHA}"
          echo "Updating: ${CURRENT_VERSION} -> ${NEW_VERSION}"
          
          # Update formula version only (no sha256 - branch URLs are mutable)
          sed -i "s|version \".*\"|version \"${NEW_VERSION}\"|" Formula/tellr.rb
          
          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add Formula/tellr.rb
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-bump tellr to ${NEW_VERSION}"
          git push
