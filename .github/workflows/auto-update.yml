name: Auto-update tellr formula

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new commits and update formula
        run: |
          # Get latest FULL commit SHA from ai-slide-generator main
          FULL_SHA=$(curl -s https://api.github.com/repos/robertwhiffin/ai-slide-generator/commits/main | jq -r '.sha')
          SHORT_SHA="${FULL_SHA:0:7}"

          # Get current version from formula
          CURRENT_VERSION=$(grep 'version "' Formula/tellr.rb | head -1 | sed 's/.*version "//;s/".*//')

          # Check if SHA already in current version
          if echo "$CURRENT_VERSION" | grep -q "$SHORT_SHA"; then
            echo "Already up to date (${CURRENT_VERSION})"
            exit 0
          fi

          # New commit found - build immutable URL and compute checksum
          NEW_VERSION="$(date -u +'%Y.%m.%d').${SHORT_SHA}"
          NEW_URL="https://github.com/robertwhiffin/ai-slide-generator/archive/${FULL_SHA}.tar.gz"
          SHA256=$(curl -sL "$NEW_URL" | shasum -a 256 | cut -d' ' -f1)

          echo "Updating: ${CURRENT_VERSION} -> ${NEW_VERSION}"
          echo "URL: ${NEW_URL}"
          echo "SHA256: ${SHA256}"

          # Update formula: url, version, and sha256
          sed -i "s|url \".*\"|url \"${NEW_URL}\"|" Formula/tellr.rb
          sed -i "s|version \".*\"|version \"${NEW_VERSION}\"|" Formula/tellr.rb
          sed -i "s|sha256 .*|sha256 \"${SHA256}\"|" Formula/tellr.rb

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add Formula/tellr.rb
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-bump tellr to ${NEW_VERSION}"
          git push
